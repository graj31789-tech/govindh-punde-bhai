<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            padding: 40px;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        p {
            color: #cbd5e1;
            font-size: 20px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #7dd3fc;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Vanakkam ??</h1>
        <p>Welcome to my GitHub website!</p>
        <a href="https://github.com/" class="btn">Visit GitHub</a>
    </div>

</body>
</html>
